name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, types, and unit tests
        run: bun run check

      - name: Audit dependencies
        run: bun run audit

      - name: Build applications
        run: bun run build

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Docker with containerd image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          version: v29.6.2
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Compose configuration
        run: bun run docker:config

      - name: Check Dockerfile
        run: docker build --check .

      - name: Start production containers
        run: docker compose -f compose.yaml -f compose.prod.yaml up --build --detach --wait --wait-timeout 180

      - name: Install Playwright browsers
        run: bunx playwright@1.62.0 install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        env:
          E2E_API_URL: http://127.0.0.1:3002
          E2E_DOCS_URL: http://127.0.0.1:3001
          E2E_WEB_URL: http://127.0.0.1:3000
        run: bun run --cwd apps/e2e test:e2e

      - name: Print container logs
        if: ${{ failure() }}
        run: docker compose -f compose.yaml -f compose.prod.yaml logs --no-color

      - name: Stop containers
        if: ${{ always() }}
        run: docker compose -f compose.yaml -f compose.prod.yaml down --remove-orphans

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          if-no-files-found: warn
          retention-days: 7
