services:
  api:
    build:
      target: api
      provenance: mode=max
      sbom: true
    command: null
    environment:
      NODE_PATH: /app/node_modules
      NODE_ENV: production
      PORT: "3002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3002").then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  docs:
    build:
      target: docs
      provenance: mode=max
      sbom: true
    command: null
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3001").then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /app/apps/docs/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  web:
    build:
      target: web
      provenance: mode=max
      sbom: true
    command: null
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch("http://127.0.0.1:3000").then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
